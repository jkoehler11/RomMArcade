<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">How RomMArcade fits between RomM and EmuDeck</title>
  <desc id="desc">RomMArcade talks to a RomM server for the library and saves, then hands ROMs and launch commands to EmuDeck.</desc>
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1b"/>
      <stop offset="1" stop-color="#0e1020"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39e6ff"/>
      <stop offset=".5" stop-color="#71ffc7"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#71ffc7"/>
    </marker>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="flowGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9bb8ff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="20" fill="url(#flowBg)"/>
  <rect width="1200" height="260" rx="20" fill="url(#flowGrid)"/>

  <g font-family="Inter, Segoe UI, sans-serif">
    <!-- RomM -->
    <g transform="translate(74 70)">
      <rect width="238" height="120" rx="14" fill="#10172a" stroke="#2b3a63"/>
      <rect x="1" y="1" width="236" height="34" rx="13" fill="#141d34"/>
      <circle cx="20" cy="18" r="4" fill="#39e6ff"/>
      <text x="32" y="22" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" letter-spacing=".12em" fill="#91a4cf">ROMM SERVER</text>
      <text x="18" y="59" font-size="16" font-weight="700" fill="#eef2ff">Your library lives here</text>
      <text x="18" y="81" font-size="11.5" fill="#91a4cf">Game metadata, covers, files, saves</text>
      <text x="18" y="99" font-size="11.5" fill="#91a4cf">and every save slot.</text>
    </g>

    <!-- RomMArcade -->
    <g transform="translate(390 54)">
      <rect width="310" height="152" rx="16" fill="#10182b" stroke="#39e6ff" stroke-opacity=".5"/>
      <rect x="1" y="1" width="308" height="38" rx="15" fill="#13243a"/>
      <circle cx="20" cy="20" r="4" fill="#55f2a4"/>
      <text x="32" y="24" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" letter-spacing=".14em" fill="#8df5c3">ROMMARCADE</text>
      <text x="20" y="67" font-size="18" font-weight="800" fill="#eef2ff">The front door</text>
      <text x="20" y="90" font-size="11.5" fill="#b4c2e2">Browse the shelf, install a game,</text>
      <text x="20" y="108" font-size="11.5" fill="#b4c2e2">pick a save, and start the right launcher.</text>
      <rect x="20" y="122" width="270" height="20" rx="10" fill="#0a111f" stroke="#2b3a63"/>
      <text x="32" y="136" font-family="JetBrains Mono, monospace" font-size="9" fill="#7384aa">NO SECOND EMULATOR SETUP</text>
    </g>

    <!-- EmuDeck -->
    <g transform="translate(778 70)">
      <rect width="238" height="120" rx="14" fill="#10172a" stroke="#2b3a63"/>
      <rect x="1" y="1" width="236" height="34" rx="13" fill="#141d34"/>
      <circle cx="20" cy="18" r="4" fill="#ffc857"/>
      <text x="32" y="22" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" letter-spacing=".12em" fill="#ffe3a1">EMUDECK</text>
      <text x="18" y="59" font-size="16" font-weight="700" fill="#eef2ff">The machine stays yours</text>
      <text x="18" y="81" font-size="11.5" fill="#91a4cf">ROM folders, BIOS, emulators</text>
      <text x="18" y="99" font-size="11.5" fill="#91a4cf">and launcher scripts.</text>
    </g>

    <!-- arrows -->
    <g fill="none" stroke="url(#flowLine)" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M312 130H382"/>
      <path d="M700 130H770"/>
    </g>
    <g font-family="JetBrains Mono, monospace" font-size="9" fill="#7e91bb">
      <text x="330" y="154">read</text>
      <text x="720" y="154">launch</text>
    </g>

    <text x="600" y="226" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#91a4cf">RomMArcade reads the library, writes the right files, and hands play to EmuDeck.</text>
  </g>
</svg>
