  <header class="topbar" id="topbar" hidden>

      <span class="brand-glyph"><svg><use href="#i-cart"/></svg></span>
      <span class="brand-text"><b>RomM</b><em>Arcade</em></span>

    <nav class="topnav" aria-label="Main">

      <kbd>/</kbd>

      <i class="dot"></i><span>Connecting</span>

    <button class="icon-btn" data-action="refresh" title="Refresh library" aria-label="Refresh library"><svg><use href="#i-refresh"/></svg></button>
