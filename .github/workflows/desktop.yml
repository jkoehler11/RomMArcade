name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x86_64
            artifact: RomMArcade-linux-x86_64
          - os: macos-15-intel
            label: macOS x86_64
            artifact: RomMArcade-macos-x86_64
          - os: windows-2022
            label: Windows x64
            artifact: RomMArcade-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev libcairo2-dev pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: PyGObject for the GTK backend
        if: runner.os == 'Linux'
        run: python -m pip install 'pygobject==3.50.0'

      - name: Build desktop bundle
        run: python packaging/build_desktop.py

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: bash packaging/build_appimage.sh

      - name: Build installer package
        if: runner.os == 'macOS'
        run: bash packaging/build_pkg.sh

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = python -c "import rommarcade; print(rommarcade.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\windows\RomMArcade.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.pkg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish executables
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Attach executables to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files="$(find release -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.pkg' \) -print)"
          if [ -z "$files" ]; then
            echo "No installer artifacts found" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "RomMArcade $TAG" --generate-notes
          fi
          # Release downloads are installers only; drop archives from older runs.
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            case "$asset" in
              *.zip|*.tar|*.tar.gz|*.tgz|*.sha256)
                gh release delete-asset "$TAG" "$asset" --yes
                ;;
            esac
          done
          # shellcheck disable=SC2086
          gh release upload "$TAG" $files --clobber
